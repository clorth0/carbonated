name: CI

on:
  pull_request:
  push:
    branches: [master]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip check
      - name: Smoke import
        run: python -c "import app; print('app imported OK')"

  pip-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pip-audit
      - name: Audit requirements (full report)
        run: pip-audit -r requirements.txt --no-deps --disable-pip -f json -o head.json || true; pip-audit -r requirements.txt --no-deps --disable-pip || true
      - name: Fail on vulnerabilities not present on base (PRs)
        if: github.event_name == 'pull_request'
        run: |
          git show "origin/${{ github.base_ref }}:requirements.txt" > base-requirements.txt
          pip-audit -r base-requirements.txt --no-deps --disable-pip -f json -o base.json || true
          python .github/scripts/audit_diff.py head.json base.json

  semgrep:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    container: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4
      - run: semgrep scan --config p/python --config p/secrets --error --metrics=off

  gitleaks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
